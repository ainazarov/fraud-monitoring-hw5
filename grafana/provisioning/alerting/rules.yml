# Rules are evaluated by Grafana, so they are visible in Alerting > Alert rules.
# A continuous stream is expected during the demonstration. A deliberate pause
# is expected to trigger the stall alert and its recovery is part of the demo.
apiVersion: 1
groups:
  - orgId: 1
    name: fraud-pipeline
    folder: HW5 Fraud Monitoring
    interval: 10s
    rules:
      - uid: hw5-high-fraud-ratio
        title: HW5 - High fraud ratio
        condition: B
        for: 30s
        noDataState: NoData
        execErrState: Error
        isPaused: false
        annotations:
          __dashboardUid__: hw5-scoring
          __panelId__: '3'
          summary: More than 20% of scored transactions are flagged
          description: The 30-second fraud ratio exceeded 0.20 for 30 seconds with at least 20 transactions in each measurement window. Investigate the business dashboard and the active model before changing the decision threshold.
        labels:
          severity: warning
          service: fraud-detector
          project: hw5
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: (sum(increase(fw_fraud_total[30s])) / clamp_min(sum(increase(fw_transactions_total[30s])), 1)) * (sum(increase(fw_transactions_total[30s])) >= bool 20)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.2]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query
      - uid: hw5-stream-stalled
        title: HW5 - Scoring stream stalled
        condition: B
        for: 30s
        noDataState: Alerting
        execErrState: Error
        isPaused: false
        annotations:
          __dashboardUid__: hw5-scoring
          __panelId__: '4'
          summary: No successful scoring for more than one minute
          description: The last successfully scored transaction is older than 60 seconds, continuously for 30 seconds, or the scorer target is unavailable. Check the producer, Kafka, the model and the scorer. An idle demo also triggers this rule by design.
        labels:
          severity: critical
          service: fraud-detector
          project: hw5
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 120, to: 0}
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: (time() - max(fw_last_transaction_timestamp_seconds{job="fraud-detector"})) + ((1 - min(up{job="fraud-detector"})) * 1000000)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              datasource: {type: __expr__, uid: __expr__}
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [60]}
                  operator: {type: and}
                  query: {params: [B]}
                  reducer: {type: last, params: []}
                  type: query
