name: Verify monitoring
on:
  push:
  pull_request:
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Start live pipeline
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Unit and pipeline regression tests
        run: docker compose --profile test run --rm --no-deps tests
      - name: Verify monitoring and model reload
        run: docker compose --profile tools run --rm --no-deps tools python scripts/verify_monitoring.py
      - name: Verify real alert firing and recovery
        run: bash scripts/verify_alerts.sh
      - name: Collect diagnostics
        if: always()
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/compose.log
          docker compose cp fraud_detector:/opt/project/storage/evidence/. reports/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitoring-evidence
          path: reports/
      - name: Stop project
        if: always()
        run: docker compose down -v
