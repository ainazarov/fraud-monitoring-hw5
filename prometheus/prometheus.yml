global:
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 5s
  external_labels:
    project: fraud-monitoring-hw5

scrape_configs:
  - job_name: fraud-detector
    static_configs:
      - targets: ['fraud_detector:8000']
  - job_name: scoring-writer
    static_configs:
      - targets: ['scoring_writer:8001']
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']
